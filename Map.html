<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Map | The Package</title>
<meta name="description" content="Three places that matter in the town that won't stop talking back to the crown.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>

  :root{
    --bark:         #3b2a1f;
    --bark-deep:    #241a12;
    --spruce:       #2d4a3a;
    --spruce-deep:  #1c2f26;
    --embers:       #c84630;
    --embers-deep:  #8f2e1e;
    --parchment:    #ede0c8;
    --parchment-2:  #e2d2ac;
    --candle:       #f0b429;
    --frost:        #d8e8e4;
    --ink:          #241a12;
    --ink-soft:     #5b4733;

    --display: 'Fraunces', serif;
    --body:    'Karla', sans-serif;
    --stamp:   'Special Elite', monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background: var(--bark-deep);
    color: var(--parchment);
    font-family: var(--body);
    font-size:16px;
    line-height:1.6;
  }
  a{ color:inherit; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }

  header.site-nav{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg, var(--bark) 0%, rgba(59,42,31,.96) 100%);
    border-bottom:3px solid var(--bark-deep);
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px; max-width:1080px; margin:0 auto;
  }
  .brand{
    font-family:var(--display); font-weight:600; font-size:19px;
    text-decoration:none; color:var(--parchment);
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .dot{ color:var(--candle); }
  nav.links{ display:flex; gap:6px; }
  nav.links a{
    font-family:var(--body); font-weight:600; font-size:14.5px;
    text-decoration:none; color:var(--parchment-2);
    padding:8px 14px; border-radius:3px;
    transition:color .15s ease, background .15s ease;
  }
  nav.links a:hover{ color:var(--candle); background:rgba(240,180,41,.08); }
  nav.links a.current{ color:var(--candle); }
  @media (max-width:560px){
    .nav-inner{ flex-direction:column; gap:10px; align-items:flex-start; }
    nav.links{ gap:2px; }
    nav.links a{ padding:6px 10px; font-size:13.5px; }
  }

  .page-head{ padding:56px 0 20px; text-align:center; }
  .section-eyebrow{
    font-family:var(--stamp); font-size:13px; color:var(--candle); margin:0 0 10px;
  }
  .page-head h1{
    font-family:var(--display); font-weight:600;
    font-size:clamp(2rem, 5vw, 2.8rem); margin:0 0 14px;
  }
  .page-head p{
    max-width:60ch; margin:0 auto; color:var(--parchment-2);
    font-size:16px; line-height:1.7;
  }

  /* ---- map stage ---- */
  .map-stage{
    margin:36px 0 20px;
    padding:0 16px 60px;
  }
  .map-frame{
    max-width:920px;
    margin:0 auto;
    border:3px solid var(--bark);
    box-shadow:0 14px 34px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .map-frame svg{ display:block; width:100%; height:auto; }

  .hotspot{ cursor:pointer; }
  .hotspot .hl{
    opacity:0;
    transition:opacity .18s ease;
  }
  .hotspot:hover .hl,
  .hotspot:focus-visible .hl{ opacity:1; }
  .hotspot .label-tag{
    opacity:0;
    transform:translateY(4px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .hotspot:hover .label-tag,
  .hotspot:focus-visible .label-tag{ opacity:1; transform:translateY(0); }
  .hotspot:focus-visible{ outline:none; }
  .hotspot:focus-visible .hl{ opacity:1; }

  .map-hint{
    text-align:center;
    font-family:var(--stamp);
    font-size:12.5px;
    color:rgba(237,224,200,.55);
    margin-top:16px;
  }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(16,10,6,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }

  .location-card{
    background:var(--parchment);
    color:var(--ink);
    max-width:460px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 24px 50px rgba(0,0,0,.55);
    transform:translateY(16px) scale(.98);
    transition:transform .2s ease;
  }
  .modal-overlay.open .location-card{ transform:translateY(0) scale(1); }

  .location-card .photo{
    position:relative;
    aspect-ratio:4/3;
    background:
      repeating-linear-gradient(45deg, rgba(36,26,18,.06) 0, rgba(36,26,18,.06) 10px, transparent 10px, transparent 20px),
      var(--bark);
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:1px solid rgba(36,26,18,.2);
  }
  .location-card .photo svg{ width:46%; height:46%; opacity:.9; }
  .location-card .photo-note{
    position:absolute;
    bottom:10px; right:12px;
    font-family:var(--stamp);
    font-size:10px;
    color:rgba(237,224,200,.55);
  }

  .location-card .lc-body{ padding:22px 24px 26px; }
  .location-card .tag{
    display:inline-block;
    font-family:var(--stamp);
    font-size:11px;
    color:#fff;
    background:var(--spruce-deep);
    padding:3px 9px;
    margin-bottom:10px;
  }
  .location-card h2{
    font-family:var(--display);
    font-weight:700;
    font-size:24px;
    margin:0 0 12px;
  }
  .location-card p.desc{
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 16px;
  }
  .location-card .residents{
    border-top:1px dashed rgba(36,26,18,.25);
    padding-top:14px;
  }
  .location-card .residents .r-label{
    font-family:var(--stamp);
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .location-card .residents .r-links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .location-card .residents a{
    text-decoration:none;
    font-size:12.5px;
    font-weight:600;
    color:var(--spruce-deep);
    background:rgba(45,74,58,.12);
    padding:4px 10px;
    border-radius:2px;
    transition:background .15s ease;
  }
  .location-card .residents a:hover{ background:rgba(45,74,58,.22); }

  .close-btn{
    position:absolute;
    top:12px; right:12px;
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background:rgba(36,26,18,.55);
    color:#fff;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{ background:rgba(36,26,18,.8); }

  footer{
    border-top:3px solid var(--bark);
    padding:30px 0;
    text-align:center;
    font-size:13px;
    color:rgba(237,224,200,.5);
  }


/* Redesigned visual language: same woodland palette, brighter editorial layout */
:root{--bark:#463226;--bark-deep:#2b211b;--spruce:#315543;--spruce-deep:#233d31;--embers:#bd4935;--embers-deep:#8f3428;--parchment:#f8f1e5;--parchment-2:#e9dbc5;--candle:#e8ae42;--frost:#dcece8;--ink:#2b211b;--ink-soft:#665344}
body{background:#f8f1e5;color:#33271f}
header.site-nav{background:#fff9ef;border-bottom:1px solid #dfd1bc;box-shadow:0 3px 18px #46322615}
.brand{color:#463226!important}.brand .dot{color:#bd4935!important}
nav.links a{color:#624e3d!important}nav.links a:hover,nav.links a.current{color:#a93c2d!important;background:#f2e2d3!important}
footer{background:#2b211b;color:#f8f1e5}
button,a,.hotspot{touch-action:manipulation}
.hotspot{cursor:pointer;outline:none;transform:none!important;transition:none!important}
.hotspot:hover,.hotspot:focus{transform:none!important;filter:drop-shadow(0 0 9px #f3c96c)!important}
.hotspot .hl{opacity:0!important}.hotspot:hover .hl,.hotspot:focus .hl{opacity:.32!important}
.map-stage{background:#e9dbc5!important;padding:24px 16px 36px!important}
.map-frame{max-width:960px!important;margin:auto;border:9px solid #fffaf0!important;border-radius:20px!important;overflow:hidden;box-shadow:0 18px 50px #46322630!important}
.map-hint{color:#5d4939!important}
.modal-overlay{z-index:1000!important}
@media(max-width:650px){.map-stage{padding:12px 5px!important}.map-frame{border-width:4px!important;border-radius:12px!important}}


/* ===== Readability fixes: dark text on the light cream background ===== */
.section-eyebrow{color:#a93c2d!important}
.page-head p{color:#4c382d!important}
.location-card .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.location-card .photo.has-img{background:#2b211b}
</style>
</head>

  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Location details">
    <div class="location-card" id="locationCard">
      <button class="close-btn" id="closeBtn" aria-label="Close">×</button>
      <div class="photo" id="photoSlot"></div>
      <div class="lc-body">
        <span class="tag" id="lcTag"></span>
        <h2 id="lcTitle"></h2>
        <p class="desc" id="lcDesc"></p>
        <div class="residents" id="lcResidents">
          <p class="r-label">CONNECTED TO</p>
          <div class="r-links" id="lcResidentLinks"></div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const LOCATIONS = {
    hearth: {
      tag: 'TOY SHOP',
      title: 'Hearth & Hollow',
      photo: 'images/hearth-hollow.jpg',   // put your screenshot here
      desc: "The village toy shop, tucked beside the old cottage. Every shelf is crowded with handmade surprises: wooden soldiers, clockwork reindeer and a few toys that seem to watch the door. Greta Windervale runs it, and it is the closest thing the town has to a meeting hall.",
      photoIcon: 'hearth',
      residents: [['Greta Windervale', './Characters.html#greta']]
    },
    coffee: {
      tag: 'COFFEE SHOP',
      title: "Murryah's Coffee",
      photo: 'images/murryahs-coffee.jpg',
      desc: "The village coffee shop: a warm stop for a drink and a conversation away from the winter cold. Opinions about the crown are traded here, quietly, between refills.",
      photoIcon: 'coffee',
      residents: []
    },
    bakery: {
      tag: 'VILLAGE BAKERY',
      title: 'Bakery',
      photo: 'images/bakery.jpg',
      desc: "A cozy bakery where fresh bread and sweet treats bring a little warmth to the snowy village. The ovens are lit before dawn, long before any royal patrol is awake.",
      photoIcon: 'bakery',
      residents: []
    }
  };

  const PHOTO_ICONS = {
    hearth: '<svg viewBox="0 0 100 100"><rect x="18" y="38" width="64" height="44" fill="#6b4a33"/><polygon points="12,38 50,14 88,38" fill="#8f2e1e"/><rect x="42" y="56" width="16" height="26" fill="#241a12"/><rect x="26" y="46" width="10" height="10" fill="#f0b429"/><rect x="64" y="46" width="10" height="10" fill="#f0b429"/></svg>',
    coffee: '<svg viewBox="0 0 100 100"><rect x="38" y="34" width="24" height="48" fill="#3b2a1f"/><polygon points="32,34 50,12 68,34" fill="#2d4a3a"/><rect x="44" y="48" width="12" height="16" fill="#241a12"/><path d="M45 54 a5 5 0 0 1 10 0" fill="none" stroke="#f0b429" stroke-width="2"/></svg>',
    bakery: '<svg viewBox="0 0 100 100"><rect x="16" y="40" width="68" height="40" fill="#5b4733"/><polygon points="10,40 50,18 90,40" fill="#c84630"/><rect x="34" y="56" width="32" height="24" fill="#241a12"/><rect x="38" y="60" width="24" height="6" fill="#f3e9d2" opacity="0.85"/></svg>'
  };

  
  const overlay = document.getElementById('modalOverlay');
  const closeBtn = document.getElementById('closeBtn');
  const photoSlot = document.getElementById('photoSlot');
  const lcTag = document.getElementById('lcTag');
  const lcTitle = document.getElementById('lcTitle');
  const lcDesc = document.getElementById('lcDesc');
  const lcResidentLinks = document.getElementById('lcResidentLinks');

  function openLocation(key){
    const loc = LOCATIONS[key];
    if(!loc) return;
    const fallback = (PHOTO_ICONS[loc.photoIcon] || '') + '<span class="photo-note">photograph pending</span>';
    photoSlot.classList.remove('has-img');
    photoSlot.innerHTML = fallback;
    if(loc.photo){
      const img = new Image();
      img.alt = loc.title;
      img.onload = ()=>{ photoSlot.innerHTML = ''; photoSlot.appendChild(img); photoSlot.classList.add('has-img'); };
      img.src = loc.photo;
    }
    lcTag.textContent = loc.tag;
    lcTitle.textContent = loc.title;
    lcDesc.textContent = loc.desc;
    lcResidentLinks.innerHTML = '';
    loc.residents.forEach(([name, href])=>{
      const a = document.createElement('a');
      a.href = href;
      a.textContent = name;
      lcResidentLinks.appendChild(a);
    });
    document.getElementById('lcResidents').style.display = loc.residents.length ? '' : 'none';
    overlay.classList.add('open');
  }

  function closeModal(){
    overlay.classList.remove('open');
  }

  document.querySelectorAll('.hotspot').forEach(el=>{
    const key = el.getAttribute('data-key');
    el.addEventListener('click', ()=> openLocation(key));
    el.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        openLocation(key);
      }
    });
  });

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{
    if(e.target === overlay) closeModal();
  });
  window.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeModal();
  });
})();
</script>
